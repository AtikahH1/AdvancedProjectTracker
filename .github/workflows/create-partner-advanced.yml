name: Create Partner Hierarchy

on:
  workflow_dispatch:
    inputs:
      partner_name:
        description: "Partner Name"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create-partner:
    runs-on: ubuntu-latest

    steps:
      - name: Create partner hierarchy
        uses: actions/github-script@v8
        env:
          PARTNER_NAME: ${{ inputs.partner_name }}
        with:
          script: |
            const partnerName = process.env.PARTNER_NAME.trim();
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (!partnerName) {
              core.setFailed(Partner Name cannot be empty.");
              return;
            }

            const phases = [
              {
                title: "Task One",
                tasks: [
                  "Subtask 1.1",
                  "Subtask 1.2",
                  "Subtask 1.3"
                ]
              },
              {
                title: "Task Two",
                tasks: [
                  "Subtask 2.1",
                  "Subtask 2.2",
                  "Subtask 2.3"
                ]
              },
              {
                title: "Task Three",
                tasks: [
                  "Subtask 3.1",
                  "Subtask 3.2",
                  "Subtask 3.3"
                ]
              }
            ];

            async function pause(milliseconds) {
              return new Promise(resolve => setTimeout(resolve, milliseconds));
            }

            async function createIssue(title, body) {
              const response = await github.rest.issues.create({
                owner: owner,
                repo: repo,
                title: title,
                body: body
                labels: ["Partner"]
              });

              return response.data;
            }

            async function addAsSubIssue(parentNumber, childDatabaseId) {
              await github.request(
                "POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues",
                {
                  owner: owner,
                  repo: repo,
                  issue_number: partnerNumber,
                  sub_issue_id: childDatabaseId,
                  headers: {
                    accept: "application/vnd.github+json",
                    "X-GitHub-Api_Version": "2026-03-10"
                  }
                }
              );
            }

            /*
            * CREATE LEVEL 1
            *
            * [Partner] TestPartner
            */
            const partnerIssue = await createIssue(
              `[Partner] ${partnerName}`,
              [
                "## Partner",
                "",
                `**Partner:** ${partnerName}`,
                "",
                "The partnership lifecycle phases are show below as sub-issues.",
                "Expand each phase to see its individual task sub-issues."
              ].join("\n")
            );

            core.info(
              `Created partner issues #${partnerIssue.number}`
            );

            let phaseCount = 0;
            let taskCount = 0;

            /*
            * Work through each phase one at a time.
            */
            for (const phase of phases) {

              /*
              * CREATE LEVEL 2
              *
              * TestPartner | Task One
              */
              const phaseIssue = await createIssue(
                `${partnerName} | ${phase.title}`,
                [
                  "## Partnership Lifecycle Phase",
                  "",
                  `**Partner:** ${partnerName}`,
                  "",
                  `**Phase:** ${phase.title}`,
                  "",
                  "Expand the sub-issues section below to view and manage the tasks for this phase."
                ].join("\n")
              );

              /*
              * ATTACH LEVEL 2 TO LEVEL 1
              *
              * [Partner] TestPartner
              * ¬ TestPartner | Task One
              */
              await addAsSubIssue(
                partnerIssue.number,
                phaseIssue.id
              );
              
