name: Create Partner Hierarchy

on:
  workflow_dispatch:
    inputs:
      partner_name:
        description: "Partner Name"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create-partner:
    runs-on: ubuntu-latest

    steps:
      - name: Create partner hierarchy
        uses: actions/github-script@v8
        env:
          PARTNER_NAME: ${{ inputs.partner_name }}
        with:
          script: |
            const partnerName = process.env.PARTNER_NAME.trim();
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (!partnerName) {
              core.setFailed(Partner Name cannot be empty.");
              return;
            }

            const phases = [
              {
                title: "Task One",
                tasks: [
                  "Subtask 1.1",
                  "Subtask 1.2",
                  "Subtask 1.3"
                ]
              },
              {
                title: "Task Two",
                tasks: [
                  "Subtask 2.1",
                  "Subtask 2.2",
                  "Subtask 2.3"
                ]
              },
              {
                title: "Task Three",
                tasks: [
                  "Subtask 3.1",
                  "Subtask 3.2",
                  "Subtask 3.3"
                ]
